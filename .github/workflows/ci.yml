name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Typst
        run: npm run setup:typst
      - run: npm run typecheck
      - run: npm test
      - name: Scorecard is up to date
        run: |
          node scripts/scorecard.mjs
          git diff --exit-code docs/EVALUATION_SCORECARD.md
